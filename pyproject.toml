[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".venv",
    "venv",
    "data",
    "docs",
    "info",
    "frontend",
    "scratch",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "W"]
ignore = ["W291", "W293"]

